name: Publish with the AMO-signed extension

# Run by hand on a release's tag once AMO has approved that version's listed
# submission (release.yml submits it and leaves the release a draft): fetches
# the approved .xpi from AMO, attaches it to the draft with its hash in the
# notes, and publishes the release. For v0.12.0 only it also attaches the one
# updates.json that sends self-distributed builds to that file (see
# .github/scripts/updates-json.ps1). Then it submits the release's Chromium zip
# to the Chrome Web Store, so both stores get the version once it is public.
# Run it on the tag (only v* tags may use the release environment).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, e.g. v0.12.0
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: windows-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # the release notes list the commits since the previous tag

      - name: Check the release is a draft
        run: |
          if ($env:TAG -ne $env:GITHUB_REF_NAME) { throw "run this workflow on the tag $env:TAG, not $env:GITHUB_REF_NAME" }
          $draft = gh release view $env:TAG --json isDraft --jq .isDraft
          if ($draft -ne 'true') { throw "$env:TAG is not a draft release" }

      - name: Fetch the approved extension from AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: ./.github/scripts/amo-fetch.ps1 -Version $env:TAG.TrimStart('v') -Out signed.xpi

      - name: Attach it and publish
        run: ./.github/scripts/attach.ps1 -Tag $env:TAG -Xpi (Resolve-Path signed.xpi).Path

      # The same attested zip the release carries. Skipped until the store's API secrets are set.
      - name: Submit the Chromium zip to the Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          if (-not ($env:CWS_CLIENT_ID -and $env:CWS_CLIENT_SECRET -and $env:CWS_REFRESH_TOKEN -and $env:CWS_PUBLISHER_ID)) {
            echo "::warning::No Chrome Web Store secrets: upload dist/downloadmanagersquared-chromium.zip from the $env:TAG release to the dashboard by hand."
            exit 0
          }
          gh release download $env:TAG -p downloadmanagersquared-chromium.zip -D cws
          ./.github/scripts/cws-upload.ps1 -Zip (Resolve-Path cws/downloadmanagersquared-chromium.zip).Path
