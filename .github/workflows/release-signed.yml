name: Attach the AMO-signed extension

# Run by hand on a release's tag once AMO has approved that version's listed
# submission (release.yml submits it): fetches the approved .xpi from AMO and
# attaches it to the release, with its hash in the notes. For v0.12.0 only it
# also attaches the one updates.json that sends self-distributed builds to
# that file (see .github/scripts/updates-json.ps1).
# Run it on the tag (only v* tags may use the release environment).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, e.g. v0.12.0
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: windows-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # the release notes list the commits since the previous tag

      - name: Check the release exists
        run: |
          if ($env:TAG -ne $env:GITHUB_REF_NAME) { throw "run this workflow on the tag $env:TAG, not $env:GITHUB_REF_NAME" }
          gh release view $env:TAG --json tagName | Out-Null
          if ($LASTEXITCODE) { throw "$env:TAG has no release" }

      - name: Fetch the approved extension from AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: ./.github/scripts/amo-fetch.ps1 -Version $env:TAG.TrimStart('v') -Out signed.xpi

      - name: Attach it
        run: ./.github/scripts/attach.ps1 -Tag $env:TAG -Xpi (Resolve-Path signed.xpi).Path
