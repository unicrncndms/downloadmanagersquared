name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0" # pure Go, as build.ps1 builds; the runner's gcc would otherwise link sqlite via cgo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # build.ps1 reads the version from the latest tag

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: go vet
        working-directory: engine
        run: go vet ./...

      - name: staticcheck
        working-directory: engine
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./... # 2026.2.2, default checks

      - name: go test
        working-directory: engine
        run: go test ./...

      - name: Known vulnerabilities the engine reaches
        working-directory: engine
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./... # fails only on vulnerable code the engine actually calls

      - name: Licences of linked Go modules
        working-directory: engine
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./... --ignore downloadmanagersquared/engine --allowed_licenses=MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC,MPL-2.0

      - name: Extension tests
        run: node --test "extension/test/*.test.js" # a glob: Node 24 doesn't take a folder

      - name: Lint the extension
        run: npx --yes web-ext@10.8.0 lint --source-dir extension --ignore-files "test/**" "dev/**"

      - name: Build
        run: ./build.ps1

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.xpi
