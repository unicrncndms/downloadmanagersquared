name: Release

# A tag vX.Y.Z drafts the release with the engine zip and the Chromium zip
# (both attested, as are the exes: gh attestation verify), submits the
# extension to addons.mozilla.org as a listed version and uploads it to the
# Chrome Web Store staged (approved, it waits for us). Both stores review it,
# which takes hours to days, so the workflow doesn't wait: release-gate.yml
# checks both every 15 minutes and, once both have approved, starts
# release-signed.yml on the tag, which attaches the AMO-signed .xpi, publishes
# the draft and then makes the Chrome version live. The release is never public
# before both stores have approved, nor without its .xpi.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Before anything else: the tag must carry docs/releases/<tag>.md.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the release notes
        shell: pwsh
        run: ./.github/scripts/release-notes.ps1 -Tag $env:GITHUB_REF_NAME | Out-Null

  ci:
    needs: notes
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write # the attestations' Sigstore certificate
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build
        run: ./build.ps1 -Version $env:TAG -Repo $env:GITHUB_REPOSITORY -NoTests # needs: ci already ran both suites

      - name: Attest the exes and zips
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dms-engine.exe
            dist/dms-host.exe
            dist/downloadmanagersquared-windows.zip
            dist/downloadmanagersquared-chromium.zip

      # Reads the previous published latest release (a draft is never "latest").
      - name: Carry updates.json
        run: ./.github/scripts/updates-json.ps1 -Tag $env:TAG -Dir dist/updates

      - name: Draft the release
        run: |
          $files = @('dist/downloadmanagersquared-windows.zip', 'dist/downloadmanagersquared-chromium.zip') + @(Get-ChildItem dist/updates/updates.json -ErrorAction SilentlyContinue | ForEach-Object FullName)
          ./.github/scripts/release-notes.ps1 -Tag $env:TAG -Files $files[0], $files[1] | Out-File -Encoding utf8 notes.md
          gh release create $env:TAG @files --draft --verify-tag --title $env:TAG --notes-file notes.md

      - name: Submit the extension to AMO (listed)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # A listed version needs a license (AMO answers 400 without one): .github/amo-metadata.json.
          # --approval-timeout 0: submit and return, the review takes far longer than a job should wait.
          npx --yes web-ext@10.8.0 sign --channel=listed --source-dir dist/extension --artifacts-dir dist/signed --api-key $env:AMO_JWT_ISSUER --api-secret $env:AMO_JWT_SECRET --amo-metadata .github/amo-metadata.json --approval-timeout 0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          echo "::notice::$env:TAG is submitted to AMO for review. The release stays a draft until both stores have approved: release-gate.yml then starts release-signed.yml on this tag."

      # Staged: approved, it waits until release-signed.yml has published the release (cws-live.ps1).
      - name: Upload the Chromium zip to the Chrome Web Store (staged)
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          if (-not ($env:CWS_CLIENT_ID -and $env:CWS_CLIENT_SECRET -and $env:CWS_REFRESH_TOKEN -and $env:CWS_PUBLISHER_ID)) {
            echo "::warning::No Chrome Web Store secrets: upload dist/downloadmanagersquared-chromium.zip from the $env:TAG draft in the dashboard by hand, with 'Defer publish' on."
            exit 0
          }
          ./.github/scripts/cws-upload.ps1 -Zip (Resolve-Path dist/downloadmanagersquared-chromium.zip).Path -Staged
