name: Release

# A tag vX.Y.Z builds a draft release with the engine zip, has AMO sign the
# extension (unlisted) and publishes the release with the signed .xpi. If AMO
# takes longer than the wait, the draft stays and release-signed.yml publishes
# it later. A release is never public without its .xpi, nor before its zip
# and exes have build provenance attestations (gh attestation verify).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write # the attestations' Sigstore certificate
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build
        run: ./build.ps1 -Version $env:TAG -Repo $env:GITHUB_REPOSITORY

      # The exes as they go into the zip; release-signed.yml doesn't rebuild them.
      - name: Attest the exes
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dms-engine.exe
            dist/dms-host.exe

      - name: Draft release with the engine
        run: |
          # Hashes are added by publish.ps1, once the zip carries the signed extension.
          ./.github/scripts/release-notes.ps1 -Tag $env:TAG | Out-File -Encoding utf8 notes.md
          gh release create $env:TAG dist/downloadmanagersquared-windows.zip --draft --verify-tag --title $env:TAG --notes-file notes.md

      - name: Sign the extension (unlisted)
        id: sign
        continue-on-error: true # a timeout leaves the draft for release-signed.yml
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@10.8.0 sign --channel=unlisted --source-dir dist/extension --artifacts-dir dist/signed --api-key $env:AMO_JWT_ISSUER --api-secret $env:AMO_JWT_SECRET --approval-timeout 1800000
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Attach the signed extension
        id: attach
        if: steps.sign.outcome == 'success'
        run: |
          $xpi = Get-ChildItem dist/signed/*.xpi | Select-Object -First 1
          ./.github/scripts/attach.ps1 -Tag $env:TAG -Xpi $xpi.FullName

      - name: Attest the zip as uploaded
        if: steps.sign.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.attach.outputs.zip }}

      - name: Publish
        if: steps.sign.outcome == 'success'
        env:
          ZIP: ${{ steps.attach.outputs.zip }}
          XPI: ${{ steps.attach.outputs.xpi }}
        run: ./.github/scripts/publish.ps1 -Tag $env:TAG -Zip $env:ZIP -Xpi $env:XPI

      - name: Signing still in review
        if: steps.sign.outcome != 'success'
        run: echo "::warning::AMO hasn't signed $env:TAG within 30 minutes. The release stays a draft; run the 'Publish a signed release' workflow on this tag (gh workflow run release-signed.yml --ref $env:TAG -f tag=$env:TAG) once AMO has signed it."
