<!doctype html>
<meta charset="utf-8">
<title>Store screenshot</title>
<!-- Composes one store screenshot (docs/img/store): a caption, and a real UI page in an iframe, scaled and cropped, framed as a window.
     ?s=<shot>; the shots are listed below. render.ps1 (docs/img/store/src) renders them all. -->
<style>
  @font-face { font-family: Rubik; src: url("/ui/fonts/Rubik.ttf") format("truetype"); font-weight: 300 900; font-display: block; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; background: #0f1115; font-family: Rubik, sans-serif; color: #e8eaee; }
  body { position: relative; background: radial-gradient(900px 520px at 12% -8%, #243459 0%, rgba(36, 52, 89, 0) 70%), radial-gradient(700px 500px at 100% 110%, #2a2142 0%, rgba(42, 33, 66, 0) 70%), #15171b; }
  .cap { position: absolute; left: 56px; top: 34px; width: 1168px; }
  .tiles { display: flex; gap: 5px; margin-bottom: 14px; }
  .tiles i { width: 14px; height: 14px; border-radius: 3px; }
  h1 { font-size: 44px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
  p { margin-top: 8px; font-size: 20px; font-weight: 400; color: #9aa1ad; line-height: 1.3; }
  .win { position: absolute; left: 56px; top: 176px; width: 1168px; height: 584px; border-radius: 10px; overflow: hidden; background: #15171b;
    border: 1px solid #343944; box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 4px 14px rgba(0, 0, 0, .4); }
  .bar { height: 28px; background: #1d2026; border-bottom: 1px solid #2c3038; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #9aa1ad; }
  .view { position: relative; width: 1166px; height: 555px; overflow: hidden; }
  iframe { position: absolute; border: 0; transform-origin: 0 0; background: #15171b; }
</style>
<div class="cap"><div class="tiles"><i style="background:#b197fc"></i><i style="background:#4fc8dc"></i><i style="background:#f17ec0"></i></div><h1 id="h"></h1><p id="p"></p></div>
<div class="win"><div class="bar" id="t"></div><div class="view"><iframe id="f"></iframe></div></div>
<script>
  // page: the UI page; vw: its width before scaling (the scale is the view's width over vw); x, y: what is cut off the left and top; open: click Details on the nth card.
  const SHOTS = {
    speed: { h: "Every connection adds speed", p: "Ethernet, Wi-Fi and a phone hotspot download one file together: 22 + 12 + 6 = 40 MB/s.",
      title: "DMS² Downloads", page: "popup.html?fixture=store", vw: 1000, x: 0, y: 0 },
    map: { h: "See which connection fetched what", p: "Each square of the file shows the connection that downloaded it.",
      title: "DMS² Downloads", page: "popup.html?fixture=store", vw: 860, x: 0, y: 92, open: 0 },
    folder: { h: "Unpacks while it downloads", p: "Download as folder extracts a zip as it arrives and frees the space.",
      title: "DMS² Downloads", page: "popup.html?fixture=store", vw: 860, x: 0, y: 92, open: 1 },
    connections: { h: "All your connections, side by side", p: "Use every connection at once, and see what each one adds.",
      title: "DMS² Settings", page: "settings.html?fixture=store#connections", vw: 1100, x: 0, y: 60 },
  };
  const q = new URLSearchParams(location.search), s = SHOTS[q.get("s")];
  h.textContent = s.h; p.textContent = s.p; t.textContent = s.title;
  const scale = 1166 / s.vw;
  f.style.cssText = `width:${s.vw}px;height:${Math.ceil(555 / scale) + s.y}px;transform:scale(${scale}) translate(${-s.x}px,${-s.y}px)`;
  f.src = "/ui/" + s.page;
  f.onload = () => { if (s.open != null) setTimeout(() => f.contentDocument.querySelectorAll('button[title="Details"], button[aria-label="Details"]')[s.open]?.click(), 300); };
</script>
