<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DMS² Downloads</title>
  <link rel="icon" href="../icons/icon.svg">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <script src="early.js"></script>
  <header>
    <div class="head">
      <h1 class="logo"><img src="../icons/icon.svg" alt="">DMS²</h1>
      <span id="conn" class="badge dim">…</span>
      <nav class="tabs" aria-label="Pages"><a class="tab" aria-current="page">Downloads</a><a class="tab" href="settings.html#connections">Settings</a></nav>
      <span class="total num" id="total"></span>
      <span class="strip" id="strip"></span>
      <button class="icon" id="openSettings" title="Connections and settings" aria-label="Connections and settings"></button>
    </div>
    <div class="version-warn" id="versionWarn" hidden></div>
    <div class="version-warn" id="vpnWarn" role="alert" hidden>VPN disconnected. All downloads stopped: nothing is sent outside the VPN.</div>
    <div class="version-warn" id="updateNote" role="status" hidden></div>
    <div class="version-warn" id="staleWarn" role="status" hidden></div>
    <div class="version-warn asks" id="asks" role="status" hidden></div>
    <div class="tools">
      <button class="primary" id="toggleAdd">+ Add</button>
      <input type="search" id="search" class="spacer" aria-label="Search downloads, or is:failed, is:paused, is:queued, is:running, is:done" placeholder="Search, or is:failed, is:paused…">

      <button id="pauseAll">Pause all</button>
      <button id="resumeAll">Resume all</button>
      <div id="selBar" role="toolbar" aria-label="Selected downloads" hidden></div>
    </div>
    <form id="addBox" hidden>
      <textarea id="addUrl" rows="2" aria-label="Links to add, one per line" placeholder="File link, landing page, magnet, .torrent, ftp:// or sftp:// link (one per line)" required spellcheck="false"></textarea>
      <button type="button" id="addFileBtn" class="add-file">Or add a .torrent or Metalink file from this PC…</button>
      <details id="addOptions">
        <summary>Options</summary>
        <div class="add-opts">
          <label hidden>Landing page <input type="url" id="addPage" placeholder="optional, for every link"></label>
          <label hidden>VPN <select id="addVpn" title="Whether this download goes through the VPN">
            <option value="">As in settings</option>
            <option value="off">Off</option>
            <option value="alongside">VPN and direct</option>
            <option value="vpn">VPN only</option>
          </select></label>
          <label id="addNameRow">File name <input type="text" id="addName" placeholder="as the server names it" spellcheck="false"></label>
          <label id="addUserRow" hidden>User <input type="text" id="addUser" placeholder="as in the link, else anonymous" spellcheck="false" autocomplete="off"></label>
          <label id="addPassRow" hidden>Password <input type="password" id="addPass" placeholder="kept encrypted, never shown" autocomplete="off"></label>
          <label id="addKeyRow" hidden>Key file <input type="text" id="addKey" placeholder="path to a private key, instead of a password" spellcheck="false" autocomplete="off"></label>
          <label id="addKeyPassRow" hidden>Passphrase <input type="password" id="addKeyPass" placeholder="if the key has one" autocomplete="off"></label>
          <label id="addSumRow">Checksum <input type="text" id="addSum" placeholder="SHA-256 or MD5, to check the file" spellcheck="false" autocomplete="off"></label>
        </div>
      </details>
      <label id="addFolderRow" class="check" hidden><input type="checkbox" id="addFolder"> Download as folder: extract it while it downloads</label>
      <div class="add-end"><span class="muted" id="addHint">Paste links here, or anywhere on the list with Ctrl+V.</span><button class="primary" id="addGo">Add</button></div>
    </form>
  </header>
  <div class="body">
    <main id="list"></main>
    <aside id="detail" aria-label="Details" hidden>
      <div class="detail-head"><b id="detailTitle"></b><button class="icon" id="detailClose" title="Close details" aria-label="Close details"></button></div>
      <div id="detailBody"></div>
    </aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announce" role="status" aria-live="polite"></div>
  <script src="../lib/version.js"></script>
  <script src="../lib/folder.js"></script>
  <script src="../lib/list.js"></script>
  <script src="../lib/uirules.js"></script>
  <script src="../lib/rows.js"></script>
  <script src="../lib/accent.js"></script>
  <script src="../lib/iface.js"></script>
  <script src="../lib/rpc.js"></script>
  <script src="host.js"></script>
  <script src="common.js"></script>
  <script src="menu.js"></script>
  <script src="card-details.js"></script>
  <script src="card-pick.js"></script>
  <script src="card-links.js"></script>
  <script src="card.js"></script>
  <script src="asks.js"></script>
  <script src="popup.js"></script>
</body>
</html>
