<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DMS² Downloads</title>
  <link rel="icon" href="../icons/icon.svg">
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body { height: 100%; }
    body { width: 480px; max-height: 600px; display: flex; flex-direction: column; }
    body.windowed { width: auto; max-height: none; }
    /* In the window: the settings page's header (see --win-* in ui.css). */
    .engine-window header { padding: var(--win-pad); }
    .engine-window .head { height: var(--win-row1); gap: 16px; white-space: nowrap; }
    .engine-window .head h1 { font-size: 18px; gap: 8px; }
    .engine-window .head h1 img { width: 22px; height: 22px; }
    .engine-window .tools { height: var(--win-row2); margin-top: var(--win-gap); gap: 6px; white-space: nowrap; }
    .engine-window main { padding: 12px 24px; }
    header { padding: 10px 14px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .head { display: flex; align-items: center; gap: 8px; }
    .head h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 6px; }
    .head h1 img { width: 18px; height: 18px; }
    .head .total { margin-left: auto; font-weight: 600; }
    .tools { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .tools .spacer { flex: 1; min-width: 0; }
    #search { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
    #addBox { margin-top: 8px; display: grid; gap: 6px; }
    #addBox[hidden] { display: none; }
    #addUrl { resize: vertical; min-height: 2.6em; }
    main { flex: 1; overflow-y: auto; padding: 10px 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .card .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 5px; font-size: 12px; min-height: 24px; }
    .card .meta .left { min-width: 0; }
    .card .meta .left.bad { color: var(--bad); }
    .card .meta .end { display: flex; align-items: center; gap: 2px; margin-left: auto; white-space: nowrap; }
    .card .meta .end > .num { margin-right: 4px; }
    .card .sub { font-size: 11px; margin-top: 1px; }
    .card [hidden] { display: none !important; }
    .card[draggable="true"] { cursor: grab; }
    .card.drop { border-color: var(--accent); }
    button.icon { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 24px; padding: 0;
      border-color: transparent; background: transparent; color: var(--muted); }
    button.icon:hover { color: var(--accent); border-color: var(--line); }
    button.icon svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    button.icon[title="Resume"] svg { fill: currentColor; }
    button.icon[title="More"] svg { stroke-width: 3; }
    .more { position: relative; display: inline-flex; }
    /* Fixed, not absolute: the list scrolls and would clip it; showMenu places it. */
    .menu { position: fixed; z-index: 30; display: grid; min-width: 140px; padding: 4px; border: 1px solid var(--line);
      border-radius: 8px; background: var(--panel); box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
    .menu button { border: 0; background: transparent; text-align: left; padding: 5px 8px; border-radius: 5px; font-size: 12px; }
    .menu button:hover { background: var(--accent-soft); }
    .card .top .size { font-size: 12px; }
    .card.line { padding: 6px 8px 6px 12px; }
    .card.line .top { margin-bottom: 0; }
    .card.line .name, .card.expandable .name { cursor: pointer; }
    .card.line .name { font-weight: 500; }
    .card.group > a { display: inline-block; margin-top: 6px; font-size: 12px; }
    .group-files { margin-top: 8px; }
    .group-files .card { margin-bottom: 6px; }
    .group-files .card:last-child { margin-bottom: 0; }
    .conns.mirrors { grid-template-columns: minmax(0, 1fr) auto; }
    .group-head { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 2px 6px; font-size: 12px; }
    .extract { margin-top: 8px; font-size: 12px; display: grid; gap: 4px; }
    .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .row .grow, .row .path { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .path { font-weight: 600; }
    .choices { display: grid; gap: 2px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
    .choices .choice { border: 0; background: transparent; text-align: left; padding: 4px 8px; border-radius: 5px; font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .choices .choice:hover { background: var(--accent-soft); }
    .choices .other { color: var(--muted); }
    .bad { color: var(--bad); }
    .card .actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .card .ask { align-items: center; }
    .card .ask > span { margin-right: 4px; font-size: 12px; }
    .pick { margin-top: 6px; font-size: 12px; }
    .pick .vpnask { display: grid; gap: 3px; padding: 6px 8px; margin-bottom: 6px; border-radius: 6px; background: var(--accent-soft); }
    .pick .files { max-height: 180px; overflow-y: auto; display: grid; gap: 2px; padding: 4px 0; }
    .pick .files label { display: flex; gap: 6px; align-items: baseline; }
    .pick .files .path { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .conns { margin-top: 6px; display: grid; grid-template-columns: minmax(70px, auto) 1fr auto auto; gap: 3px 8px; align-items: center; font-size: 12px; }
    .conns .why { grid-column: 1 / -1; margin-top: -2px; color: var(--muted); font-size: 11px; }
    details { margin-top: 6px; font-size: 12px; }
    details section { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    details h3 { margin: 0 0 3px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    details .switch { display: flex; gap: 6px; align-items: center; }
    details .switch .badge { cursor: help; }
    details .row .path { font-weight: 400; }
    .facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; margin: 6px 0 0; }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    summary { cursor: pointer; color: var(--muted); }
    .activity { list-style: none; margin: 4px 0 6px; padding: 0; max-height: 160px; overflow-y: auto; font-size: 11px; display: grid; gap: 2px; }
    .activity li { overflow-wrap: anywhere; }
    .form { display: grid; grid-template-columns: 1fr auto; gap: 4px 6px; margin-top: 6px; }
    .form label { grid-column: 1 / -1; color: var(--muted); margin-top: 4px; }
    .form input { min-width: 0; grid-column: 1 / -1; }
    .form .actions { grid-column: 1 / -1; margin-top: 4px; }
    footer { padding: 8px 14px 10px; border-top: 1px solid var(--line); background: var(--panel); display: flex; }
    footer button { flex: 1; }
    .version-warn { margin-top: 6px; padding: 5px 8px; border-radius: 6px; background: var(--accent-soft); font-size: 12px; }
    .version-warn[hidden] { display: none; }
    #updateNote { display: flex; align-items: center; gap: 6px; }
    #updateNote > span { flex: 1; }
    #addBox .check { display: flex; gap: 6px; align-items: center; font-size: 12px; }
    #addBox .check[hidden] { display: none; }
    .facts dd.lines { white-space: pre-line; }
    .facts dd.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; }
    .offline { padding: 12px; border-radius: 6px; background: var(--accent-soft); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="head">
      <h1><img src="../icons/icon.svg" alt="">DMS²</h1>
      <span id="conn" class="badge dim">…</span>
      <span class="total num" id="total"></span>
    </div>
    <div class="version-warn" id="versionWarn" hidden></div>
    <div class="version-warn" id="updateNote" role="status" hidden></div>
    <div class="version-warn" id="staleWarn" role="status" hidden></div>
    <div class="tools">
      <button class="small" id="toggleAdd">+ Add</button>
      <input type="search" id="search" class="spacer" aria-label="Search downloads" placeholder="Search downloads">

      <button class="small" id="pauseAll">Pause all</button>
      <button class="small" id="resumeAll">Resume all</button>
    </div>
    <form id="addBox" hidden>
      <textarea id="addUrl" rows="2" aria-label="Links to add, one per line" placeholder="File link, landing page, magnet or .torrent link (one per line)" required spellcheck="false"></textarea>
      <input type="url" id="addPage" aria-label="Landing page" placeholder="Landing page (optional, for every link)">
      <select id="addVpn" title="Whether this download goes through the VPN">
        <option value="">VPN as in settings</option>
        <option value="off">No VPN</option>
        <option value="alongside">VPN and direct</option>
        <option value="vpn">VPN only</option>
      </select>
      <label id="addFolderRow" class="check" hidden><input type="checkbox" id="addFolder"> Download as folder: extract it while it downloads</label>
      <button class="primary">Add</button>
    </form>
  </header>
  <main id="list"></main>
  <footer><button id="openSettings">Connections &amp; settings</button></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announce" role="status" aria-live="polite"></div>
  <script src="../lib/version.js"></script>
  <script src="../lib/folder.js"></script>
  <script src="../lib/list.js"></script>
  <script src="../lib/accent.js"></script>
  <script src="host.js"></script>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
