<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DMS² Downloads</title>
  <link rel="icon" href="../icons/icon.svg">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="head">
      <h1><img src="../icons/icon.svg" alt="">DMS²</h1>
      <span id="conn" class="badge dim">…</span>
      <span class="total num" id="total"></span>
    </div>
    <div class="version-warn" id="versionWarn" hidden></div>
    <div class="version-warn" id="updateNote" role="status" hidden></div>
    <div class="version-warn" id="staleWarn" role="status" hidden></div>
    <div class="tools">
      <button class="small" id="toggleAdd">+ Add</button>
      <input type="search" id="search" class="spacer" aria-label="Search downloads" placeholder="Search downloads">

      <button class="small" id="pauseAll">Pause all</button>
      <button class="small" id="resumeAll">Resume all</button>
    </div>
    <form id="addBox" hidden>
      <textarea id="addUrl" rows="2" aria-label="Links to add, one per line" placeholder="File link, landing page, magnet or .torrent link (one per line)" required spellcheck="false"></textarea>
      <input type="url" id="addPage" aria-label="Landing page" placeholder="Landing page (optional, for every link)">
      <select id="addVpn" title="Whether this download goes through the VPN">
        <option value="">VPN as in settings</option>
        <option value="off">No VPN</option>
        <option value="alongside">VPN and direct</option>
        <option value="vpn">VPN only</option>
      </select>
      <label id="addFolderRow" class="check" hidden><input type="checkbox" id="addFolder"> Download as folder: extract it while it downloads</label>
      <button class="primary">Add</button>
    </form>
  </header>
  <main id="list"></main>
  <footer><button id="openSettings">Connections &amp; settings</button></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announce" role="status" aria-live="polite"></div>
  <script src="../lib/version.js"></script>
  <script src="../lib/folder.js"></script>
  <script src="../lib/list.js"></script>
  <script src="../lib/accent.js"></script>
  <script src="host.js"></script>
  <script src="common.js"></script>
  <script src="menu.js"></script>
  <script src="card.js"></script>
  <script src="popup.js"></script>
</body>
</html>
