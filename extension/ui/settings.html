<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DMS² Settings</title>
  <link rel="icon" href="../icons/icon.svg">
  <link rel="stylesheet" href="ui.css">
  <style>
    header {
      position: sticky; top: 0; z-index: 30;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
      padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
    header h1 img { width: 22px; height: 22px; }
    header nav { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px; }
    header nav a { padding: 4px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 13px; }
    header nav a:hover { color: var(--accent); background: var(--accent-soft); }
    main { max-width: 1040px; margin: 0 auto; padding: 20px 24px 60px; }
    section { scroll-margin-top: 70px; }
    h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; }
    h3 { font-size: 13px; margin: 18px 0 10px; color: var(--muted); font-weight: 600; display: flex; align-items: center; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
    .row-actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }

    /* Settings: label on the left, control on the right, one per line. */
    .fields { display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 360px); gap: 10px 20px; align-items: center; }
    .fields label { display: flex; align-items: center; }
    .fields input[type=text], .fields input[type=password], .fields select { width: 100%; }
    .fields input[type=number] { width: 110px; }

    /* Connections: one aligned grid, header and rows alike. */
    .conn-grid { min-width: 720px; }
    .conn-row {
      display: grid; align-items: center; gap: 8px 10px; padding: 9px 0;
      grid-template-columns: minmax(140px, 1.5fr) 40px 46px 72px 58px 128px minmax(110px, 1fr) 64px;
      border-top: 1px solid var(--line); font-size: 13px;
    }
    .conn-row.head { border-top: 0; padding-top: 0; color: var(--muted); font-size: 12px; font-weight: 500; }
    .conn-row.head > span { display: flex; align-items: center; }
    .conn-row.absent { opacity: .5; }
    .conn-row .center { justify-self: center; }
    .conn-row .who b { font-weight: 600; }
    .conn-row .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .conn-row .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .conn-row input[type=number] { width: 56px; }
    .conn-row .limits { display: flex; align-items: center; gap: 3px; white-space: nowrap; color: var(--muted); }
    .conn-row .limits input { width: 54px; }
    .conn-row .vpn { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .conn-row .speed { text-align: right; }
    @media (max-width: 760px) { .conn-scroll { overflow-x: auto; } } /* tooltips clip in a scroll box: only when needed */
    .follow { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }

    .toast { bottom: 16px; }
    @media (max-width: 700px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      header nav { margin-left: 0; }
      .fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1><img src="../icons/icon.svg" alt="">DMS² settings</h1>
    <span id="conn" class="badge dim">…</span>
    <nav>
      <a href="#connections">Connections</a>
      <a href="#downloads">Downloads</a>
      <a href="#torrents">Torrents</a>
      <a href="#vpn">VPN</a>
      <a href="#sites">Sites</a>
    </nav>
  </header>
  <main>
    <section id="connections" class="panel">
      <h2>Network connections</h2>
      <div class="conn-scroll">
        <div class="conn-grid">
          <div class="conn-row head">
            <span>Connection</span>
            <span class="center">Use</span>
            <span class="center">Main<span class="info" tabindex="0" data-tip="Used alone for servers that can't split a file, and it decides which file the other connections must match."></span></span>
            <span>Requests<span class="info" tabindex="0" data-tip="How many parts of a download this connection fetches at the same time."></span></span>
            <span class="center">Upload</span>
            <span>Limit (MB/s)</span>
            <span>VPN</span>
            <span class="speed">Speed</span>
          </div>
          <div id="ifaces"></div>
        </div>
      </div>
      <label class="follow"><input type="checkbox" id="followWindows"> Let Windows pick the main connection</label>
      <div class="row-actions"><button id="refreshIfaces">Look for connections again</button></div>
      <input type="file" id="confFile" accept=".conf,text/plain" hidden>
    </section>

    <section id="downloads" class="panel">
      <h2>Downloads</h2>
      <div class="fields">
        <label for="sDir">Download folder</label>
        <input type="text" id="sDir" data-setting>

        <label for="sThreshold">Take over Firefox downloads above (GB)</label>
        <input type="number" id="sThreshold" min="0.001" step="any" data-setting>

        <label for="sParallel">Downloads at once</label>
        <input type="number" id="sParallel" min="1" max="16" data-setting>

        <label for="sConns">Default requests per connection</label>
        <input type="number" id="sConns" min="1" max="32" data-setting>

        <label for="sEta">Time-left averaging (seconds)
          <span class="info" tabindex="0" data-tip="Longer gives a steadier estimate; shorter reacts faster to speed changes."></span></label>
        <input type="number" id="sEta" min="5" max="3600" data-setting>
      </div>
    </section>

    <section id="torrents" class="panel">
      <h2>Torrents</h2>
      <div class="fields">
        <label for="sRatio">Seed until ratio
          <span class="info" tabindex="0" data-tip="A finished torrent keeps uploading until it has sent this many times its size. 0 stops as soon as it's done."></span></label>
        <input type="number" id="sRatio" min="0" max="100" step="0.1" data-setting>
      </div>
    </section>

    <section id="vpn" class="panel">
      <h2>VPN</h2>
      <div class="fields">
        <label for="sVpnHttp">VPN for downloads
          <span class="info" tabindex="0" data-tip="Firefox already contacted the server once from your own address before handing a download over. To avoid that, right-click the link and choose “Download with DMS²”."></span></label>
        <select id="sVpnHttp" data-setting></select>

        <label for="sVpnTorrent">VPN for torrents</label>
        <select id="sVpnTorrent" data-setting></select>

        <label for="vpnProvider">VPN provider
          <span class="info" tabindex="0" data-tip="Signing in to a provider gives every connection without its own .conf a tunnel. For other VPNs, import a .conf per connection above."></span></label>
        <select id="vpnProvider">
          <option value="">None</option>
          <option value="pia">Private Internet Access</option>
        </select>
      </div>

      <div id="piaBox" hidden>
      <h3>Private Internet Access
        <span class="info" tabindex="0" data-tip="Your login is stored encrypted and never shown again."></span>
      </h3>
      <div class="fields">
        <span class="muted">Status</span>
        <span><span id="piaState" class="badge dim">Not set up</span> <span id="piaError" class="muted"></span></span>
        <label for="piaUser">Username</label>
        <input type="text" id="piaUser" placeholder="p1234567" autocomplete="off">
        <label for="piaPass">Password</label>
        <input type="password" id="piaPass" autocomplete="off">
        <label for="piaRegion">Region</label>
        <select id="piaRegion"><option value="">Lowest latency</option></select>
      </div>
      <div class="row-actions">
        <button class="primary" id="piaSave">Sign in</button>
        <button id="piaClear">Sign out</button>
      </div>
      </div>
    </section>

    <section id="sites" class="panel">
      <h2>Sites that need a link per connection
        <span class="info" tabindex="0" data-tip="Some sites give a download link that only works for the address that opened the page. DMS² then opens the page once through each connection to get each its own link."></span>
      </h2>
      <h3>Learned sites</h3>
      <div id="recipes"></div>
    </section>

    <section id="startup" class="panel">
      <h2>Startup</h2>
      <div class="fields">
        <label for="sAuto">Start with Windows</label>
        <span><input type="checkbox" id="sAuto"></span>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="host.js"></script>
  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
